<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Pago aprobado — KRATOS</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/png" href="/img/logo-kratos.png">
</head>
<body>
  <main class="contenido" style="max-width: 560px; margin: 0 auto; text-align: center; padding-top: 100px;">
    <span class="hero__eyebrow" style="color: var(--lime);">PAGO APROBADO</span>
    <h1 style="font-family: var(--font-display); font-size: 32px; margin: 16px 0;">¡Gracias por tu compra!</h1>
    <p id="detalle-orden" style="color: var(--text-muted);">Estamos confirmando los últimos detalles...</p>
    <p style="color: var(--text-muted);">Te enviamos la confirmación por email. Si tenés cuenta, también podés seguir el pedido desde "Mi cuenta".</p>
    <a href="/" class="btn-primario" style="display:inline-block; text-decoration:none; margin-top: 24px; padding: 12px 28px;">Volver a la tienda</a>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/sitio.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ordenId = params.get('orden');
    if (ordenId) {
      api.get(`/pagos/orden/${ordenId}`)
        .then((orden) => {
          const estados = { pagado: 'pago aprobado', pendiente: 'pago en proceso', rechazado: 'pago rechazado' };
          document.getElementById('detalle-orden').textContent =
            `Pedido #${orden.id} — ${estados[orden.estado] || orden.estado}. Total: ${new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(orden.total)}`;

          // Registramos la compra una sola vez por pedido
          const clave = `compra-registrada-${orden.id}`;
          let yaRegistrada = false;
          try { yaRegistrada = sessionStorage.getItem(clave) === '1'; } catch (e) {}
          if (!yaRegistrada) {
            const registrar = () => window.registrarEvento?.('purchase', { transaction_id: String(orden.id), value: orden.total });
            // Esperamos a que sitio.js haya cargado la analítica
            window.obtenerConfigSitio?.().then(() => setTimeout(registrar, 0));
            try { sessionStorage.setItem(clave, '1'); } catch (e) {}
          }
        })
        .catch(() => {
          document.getElementById('detalle-orden').textContent = 'No pudimos recuperar el detalle, pero tu pago fue registrado por Mercado Pago.';
        });
    }
  </script>
</body>
</html>
