# Publicación en Render (https://render.com) con "Blueprint".
# Crea la base PostgreSQL y el servidor web. Las claves secretas
# (sync: false) se cargan a mano en el panel de Render.

databases:
  - name: kratos-db
    databaseName: supple_store
    plan: free

services:
  - type: web
    name: kratos-store
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kratos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true

      # URL pública con https, por ejemplo https://kratos-store.onrender.com
      - key: FRONTEND_URL
        sync: false

      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false

      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TIENDA
        sync: false

      - key: ENVIO_COSTO
        sync: false
      - key: ENVIO_GRATIS_DESDE
        sync: false
      - key: RETIRO_DIRECCION
        sync: false

      - key: NEGOCIO_RAZON_SOCIAL
        sync: false
      - key: NEGOCIO_CUIT
        sync: false
      - key: NEGOCIO_DOMICILIO
        sync: false
      - key: NEGOCIO_EMAIL
        sync: false
      - key: NEGOCIO_WHATSAPP
        sync: false
      - key: NEGOCIO_INSTAGRAM_URL
        sync: false
      - key: NEGOCIO_TIKTOK_URL
        sync: false

      - key: GA_MEASUREMENT_ID
        sync: false
      - key: META_PIXEL_ID
        sync: false
